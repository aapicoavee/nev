<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quality Monitor">
<title>AAPICO AVEE Quality Monitor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b1d3f">
<style>
html,body{margin:0;height:100%;background:#0b1d3f;overscroll-behavior:none;overflow:hidden;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#0b1d3f}
iframe{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);width:100%;height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;background:#f4f5f7}
.bot{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom);background:#ffffff}
.load{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top);background:#f4f5f7;z-index:2;display:grid;place-items:center;text-align:center;transition:opacity .3s}
.load img{width:72px;height:72px;border-radius:18px;border:1px solid #e6e8ec;background:#fff}
.load p{margin:12px 0 0;color:#5d6675}
.load a{color:#0a6fe8}
.load.off{opacity:0;pointer-events:none}
#inst{position:fixed;right:14px;bottom:84px;z-index:5;border:0;border-radius:99px;background:#0b1d3f;color:#fff;font:600 14px system-ui,sans-serif;padding:10px 16px;box-shadow:0 6px 20px rgb(0 0 0/.2);cursor:pointer}
#inst[hidden]{display:none}
@media(prefers-color-scheme:dark){iframe{background:#0d0f13}.bot{background:#161920}.load{background:#0d0f13;color:#eef0f4}}
</style>
</head>
<body>
<div class="load" id="load"><div><img src="icon-192.png" alt="AAPICO AVEE"><p id="msg">Loading Quality Monitor…</p></div></div>
<div class="bot"></div>
<iframe id="f" credentialless allow="clipboard-write" title="Quality Monitor"></iframe>
<button id="inst" hidden>Install app</button>
<script>
{
const APP='https://script.google.com/macros/s/AKfycbyiWQXcLkXfMZ55FEa4sOJ-OLIrDBpahAfp_72Vi7guljjdkrXZGyy0aDGQS-OGiLO7pg/exec';
let mode='';try{mode=localStorage.getItem('qm-mode')||''}catch{}
const q=new URLSearchParams(location.search).get('view');if(q==='app'||q==='tl')mode=q;
const f=document.getElementById('f'),load=document.getElementById('load');
f.src=APP+(mode?'?view='+mode:'');
f.onload=()=>load.classList.add('off');
setTimeout(()=>{if(!load.classList.contains('off'))document.getElementById('msg').innerHTML='Still loading… <a href="'+APP+'">open directly</a>'},15000);
addEventListener('message',e=>{if(!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname))return;const m=e.data&&e.data.qmMode;if(m==='app'||m==='tl'){try{localStorage.setItem('qm-mode',m)}catch{}}});
let ev=null;const b=document.getElementById('inst');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;b.hidden=false});
b.onclick=async()=>{if(!ev)return;ev.prompt();await ev.userChoice;ev=null;b.hidden=true};
addEventListener('appinstalled',()=>{b.hidden=true});
}
</script>
</body>
</html>
